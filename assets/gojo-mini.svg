<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" font-family="'Segoe UI', Ubuntu, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0620"/><stop offset="1" stop-color="#170b33"/>
  </linearGradient>
  <clipPath id="face"><circle cx="52" cy="48" r="33"/></clipPath>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
    <stop offset="0.55" stop-color="#a855f7"/>
    <stop offset="1" stop-color="#e879f9" stop-opacity="0.15"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
